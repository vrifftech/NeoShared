name: Publish versioned release

on:
  workflow_call:
    inputs:
      version-file:
        required: true
        type: string
      artifact-pattern:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version change
        id: version
        env:
          VERSION_FILE: ${{ inputs.version-file }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          path = os.environ['VERSION_FILE']
          pattern = r'\s*#define\s+\w+_VERSION_STRING\s+"(\d+\.\d+\.\d+)"'
          current_text = subprocess.check_output(
              ['git', 'show', f'{os.environ["GITHUB_SHA"]}:{path}'], text=True)
          current = re.search('^' + pattern, current_text, re.M).group(1)
          changes = subprocess.check_output(
              ['git', 'diff', '--unified=0', os.environ['BEFORE'],
               os.environ['GITHUB_SHA'], '--', path], text=True)
          added = re.findall(r'^\+' + pattern, changes, re.M)
          removed = re.findall(r'^-' + pattern, changes, re.M)
          changed = added != removed
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'number={current}', file=output)
              print(f'changed={str(changed).lower()}', file=output)
          print(f'Version: {current}; changed={changed}')
          PY

      - name: Publish packages
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.number }}
          ARTIFACT_PATTERN: ${{ inputs.artifact-pattern }}
        run: |
          gh run download "$GITHUB_RUN_ID" --pattern "$ARTIFACT_PATTERN" --dir packages
          shopt -s nullglob
          gh release create "v$VERSION" \
            packages/*/*.exe packages/*/*.zip packages/*/*.tar.gz packages/*/*.AppImage \
            packages/*/*.deb packages/*/*.sha256 \
            --target "$GITHUB_SHA" --title "${GH_REPO#*/} v$VERSION" \
            --generate-notes
