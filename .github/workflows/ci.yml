name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '47 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            ninja-build

      - name: Configure and build
        run: |
          bash ./scripts/build.sh \
            --build-dir build \
            --build-type Release \
            --minimal-release OFF \
            --generator Ninja \
            --jobs 2 \
            --clean


  windows:
    name: Windows (Visual Studio 2026 + wxWidgets 3.3.3 overlay)
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite

    steps:
      - name: Check out neoshared
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Enable vcpkg GitHub Actions cache
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Validate wxWidgets 3.3.3 overlay
        shell: pwsh
        run: |
          .\scripts\install-wxwidgets.ps1 `
            -VcpkgRoot $env:VCPKG_INSTALLATION_ROOT `
            -Triplet x64-windows-static `
            -CleanAfterBuild

      - name: Upload wxWidgets vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: neoshared-wxwidgets-vcpkg-logs-${{ github.run_id }}
          path: .ci-logs/vcpkg-wxwidgets/
          if-no-files-found: warn
          retention-days: 7

      - name: Configure and build
        shell: pwsh
        run: |
          .\scripts\build.ps1 `
            -BuildDir build `
            -BuildType Release `
            -MinimalRelease OFF `
            -Generator 'Visual Studio 18 2026' `
            -Platform x64 `
            -Parallel 2 `
            -Clean

